name: Check PR has release/* label

on:
  pull_request:
    branches: [ minecraft/v* ]
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - synchronize

permissions:
  pull-requests: read

jobs:
  has-release-label:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      # agilepathway/pull-request-label-checker v1.6.65
      - uses: docker://agilepathway/pull-request-label-checker@sha256:253c71fe97d6ae19fff21608f1e10493ec322e7c95d4fed4695b2b8d11f58fb2
        id: release-label
        with:
          one_of: release/major,release/minor,release/patch,release/none
          repo_token: ${{ secrets.GITHUB_TOKEN }}
