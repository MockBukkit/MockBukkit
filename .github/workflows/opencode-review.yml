name: OpenCode Paper Parity Review

# Opt-in reviewer: comment `/oc review` on a pull request.
#
# It builds the real Paper server sources for the exact version this repo targets
# (via paperweight-userdev) and asks an agent whether the changed mocks actually
# behave like the real implementation. It only ever posts a comment -- there is no
# write token and no push step, so it cannot modify the pull request.
#
# Runs from the default branch (issue_comment), so it has access to secrets even
# when the pull request comes from a fork. That is also why it is gated to people
# who can already push to this repository: the job checks out and builds the pull
# request's code, which means running its Gradle scripts.

on:
  issue_comment:
    types: [ created ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: oc-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  parity-review:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/oc review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Acknowledge the command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes --silent || true

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr diff "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --name-only > /tmp/changed-all.txt
          # Only Java under src/ is worth a parity check.
          grep -E '^src/.*\.java$' /tmp/changed-all.txt > /tmp/changed.txt || true
          echo "count=$(wc -l < /tmp/changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Skip when no Java changed
        if: steps.pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --body "🐙 No Java files under \`src/\` changed in this PR, so there is nothing to parity-check."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.count != '0'
        with:
          # refs/pull/N/head resolves for fork PRs too, unlike the head SHA.
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Set up JDK 25
        if: steps.pr.outputs.count != '0'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.pr.outputs.count != '0'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # The paperweight caches contain Mojang-derived artifacts (the mojang-mapped
          # server jar and the applied sources). Those must not end up in a shared,
          # restorable Actions cache -- regenerating takes about a minute anyway.
          cache-disabled: true

      - name: Build Paper reference sources
        if: steps.pr.outputs.count != '0'
        run: ./gradlew :metaminer:paperweightUserdevSetup

      - name: Extract Paper sources
        if: steps.pr.outputs.count != '0'
        id: paper
        run: |
          set -euo pipefail
          # TODO: paperweight only writes this to a content-hashed cache directory.
          # Replace with a small Gradle task that reports the path once we have one.
          JAR="$(ls -t "$HOME"/.gradle/caches/paperweight-userdev/v2/work/applyDevBundlePatches_*/output.jar 2>/dev/null | head -1 || true)"
          if [ -z "$JAR" ]; then
            echo "::error::Could not locate the paperweight output jar."
            exit 1
          fi
          DEST="$RUNNER_TEMP/paper-src"
          mkdir -p "$DEST"
          # Sources only -- the .class files are dead weight for a reading agent.
          unzip -q "$JAR" '*.java' -d "$DEST"
          echo "Extracted $(find "$DEST" -name '*.java' | wc -l) sources from $JAR"
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"

      - name: Install OpenCode
        if: steps.pr.outputs.count != '0'
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run parity review
        if: steps.pr.outputs.count != '0'
        env:
          # Deliberately no GH_TOKEN in this step: the agent gets no credentials
          # and no way to reach the pull request.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PAPER_SRC: ${{ steps.paper.outputs.dir }}
        run: |
          set -euo pipefail
          PROMPT="$(sed -e "s#__PAPER_SRC__#$PAPER_SRC#g" .github/opencode/paper-parity-prompt.md)"
          PROMPT="$PROMPT

          ## Changed files in this pull request

          $(cat /tmp/changed.txt)"
          opencode run --model deepseek/deepseek-v4-flash "$PROMPT" > /tmp/findings.md
          echo "--- findings ---"
          head -40 /tmp/findings.md

      - name: Post findings
        if: steps.pr.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY=/tmp/comment.md
          {
            echo "## 🐙 Paper parity review"
            echo
            echo "_Checked against real Paper sources for \`$(grep -oP 'paper\.api\.full-version=\K.*' gradle.properties)\`._"
            echo
            # PR comments cap out at 65536 characters.
            head -c 60000 /tmp/findings.md
          } > "$BODY"
          gh pr comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file "$BODY"
